# query-json REPL Demo (autocast)
# Generates an asciinema .cast file
# Usage: autocast docs/repl-demo.yaml docs/repl-demo.cast
# Then:  agg docs/repl-demo.cast docs/repl-demo.gif

settings:
  width: 100
  height: 40
  title: "query-json REPL Demo"
  type_speed: 80ms
  timeout: 60s
  prompt: "$ "
  shell:
    program: bash
    args:
      - --norc
      - --noprofile
    prompt: "AUTOCAST$ "
    line_split: ' \'
    quit_command: exit
  environment:
    - name: PS1
      value: "AUTOCAST$ "
    - name: PATH
      value: "/home/me/query-json/_opam/bin:/usr/local/bin:/usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/home/me/.local/bin"

instructions:
  - !Interactive
    command: "query-json --repl cli/test/mock.json"
    type_speed: 80ms
    keys:
      - 3s
      - ^H
      - k
      - e
      - y
      - s
      - 2s
      - ^H
      - ^H
      - ^H
      - ^H
